spring:
  application:
    name: rook
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ROOK_DB_URL:jdbc:postgresql://localhost:5432/rook}
    username: ${ROOK_DB_USER:rook}
    password: ${ROOK_DB_PASSWORD:rook}
    hikari:
      maximum-pool-size: ${ROOK_DB_POOL:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${ROOK_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${ROOK_TRACE_SAMPLE:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${ROOK_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: rook
      role: ${ROOK_ROLE:all}

logging:
  structured:
    format:
      console: logstash

rook:
  role: ${ROOK_ROLE:all}
  workflow:
    bootstrap-servers: ${ROOK_KAFKA_BOOTSTRAP:localhost:9092}
    workers: ${ROOK_WORKERS:4}
