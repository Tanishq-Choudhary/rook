name: rook

include:
  - dev.yml

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ROOK_DB_URL: jdbc:postgresql://postgres:5432/rook
      ROOK_KAFKA_BOOTSTRAP: kafka:29092
      ROOK_CONTROL_BOOTSTRAP_KEY: ${ROOK_ADMIN_KEY:?set ROOK_ADMIN_KEY to a key of at least 32 characters}
      ROOK_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      ROOK_TRACE_SAMPLE: "0.1"
      ROOK_GITHUB_APP_ID: ${ROOK_GITHUB_APP_ID:-}
      ROOK_GITHUB_WEBHOOK_SECRET: ${ROOK_GITHUB_WEBHOOK_SECRET:-}
      ROOK_GITHUB_PRIVATE_KEY: ${ROOK_GITHUB_PRIVATE_KEY:-}
      ROOK_CONTROL_RATE_BURST: ${ROOK_CONTROL_RATE_BURST:-60}
      ROOK_CONTROL_RATE_PER_SECOND: ${ROOK_CONTROL_RATE_PER_SECOND:-10}
      ROOK_PIPELINE_WORK_DIR: /var/lib/rook/work
      ROOK_PIPELINE_CACHE_DIR: /var/lib/rook/cache
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/rook:/var/lib/rook
    group_add:
      - ${DOCKER_GID:-999}
    ports:
      - "${ROOK_SERVER_PORT:-8080}:8080"

  dashboard:
    build:
      context: ../../dashboard
    depends_on:
      server:
        condition: service_healthy
    environment:
      ROOK_API_URL: http://server:8080
    ports:
      - "${ROOK_DASHBOARD_PORT:-3001}:3000"
